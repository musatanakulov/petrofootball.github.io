# Nginx для Петро-футбола. Замените petrofootball.kz на свой домен.
# Положить в /etc/nginx/sites-available/petrofootball и включить:
#   ln -s /etc/nginx/sites-available/petrofootball /etc/nginx/sites-enabled/
# HTTPS добавит certbot:  certbot --nginx -d petrofootball.kz -d www.petrofootball.kz
# (он сам допишет блок 443, сертификаты и редирект с http на https)
# Эти директивы (limit_req_zone, map, gzip) находятся на уровне http — файл из sites-enabled подключается именно туда.

# Ограничение частоты: общее и более жёсткое для запросов, которые что-то меняют (не GET)
map $request_method $pf_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
}
limit_req_zone $binary_remote_addr zone=pf_api:10m rate=10r/s;
limit_req_zone $pf_write_key       zone=pf_write:10m rate=2r/s;
limit_req_status 429;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 80;
    listen [::]:80;
    server_name petrofootball.kz www.petrofootball.kz;

    server_tokens off;

    # Админ загружает пачки фото, Excel и Word. Каждый файл приложение ограничивает 25 МБ.
    client_max_body_size 200m;

    # Служебные файлы закрыты, даже если окажутся рядом с кодом
    location ~ /\.(env|git) { return 404; }
    location ~ \.(db|db-wal|db-shm|py|pyc|ps1|log)$ { return 404; }
    location ^~ /backups/ { return 404; }
    location ^~ /logs/ { return 404; }

    location / {
        limit_req zone=pf_api burst=40 nodelay;
        limit_req zone=pf_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Эти заголовки приложение использует, чтобы понять: запрос пришёл из интернета, а не с этого же компьютера
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
